[pytest]
DJANGO_SETTINGS_MODULE = backend.test_settings
python_files = tests.py test_*.py *_tests.py
pythonpath = .
addopts = --import-mode=importlib
asyncio_mode = auto
markers =
    slow: slower-running regression tests
    integration: integration tests spanning multiple layers
testpaths =
    users/tests.py
    utils/tests.py
    backend/test_exception_handler.py
    tests/test_spa_index.py
    tests/test_requirements_pins.py
