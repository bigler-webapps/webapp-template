[pytest]
DJANGO_SETTINGS_MODULE = backend.test_settings
python_files = tests.py test_*.py *_tests.py
pythonpath = .
addopts = --import-mode=importlib --ignore=users/test_management.py --ignore=backend/test_management_urls.py --ignore=backend/test_management_test_settings.py
markers =
    slow: slower-running regression tests
    integration: integration tests spanning multiple layers
testpaths =
    tests/test_requirements_pinned.py
    users/tests.py
    utils/tests.py
    backend/test_exception_handler.py
    tests/test_spa_index.py
    tests/test_permission_inventory.py
    backend/test_ws_inventory.py
    tests/test_database_driver.py
    tests/test_security_settings.py
