services:
  backend:
    ports:
      - "${WEB_PORT}:8000"
    volumes:
      - ./backend/media:/app/backend/media
    # keine extra environment: ENV_TYPE und TRAEFIK_ROUTER_RULE kommen aus .env

  db:
    ports:
      - "${DB_HOST_PORT}:5432"

networks:
  proxy:
    external: false
    # generischer Name, abgeleitet aus CONTAINER_NAME_PREFIX aus .env
    name: ${CONTAINER_NAME_PREFIX}_local_proxy

volumes:
  postgres_data:
    external: false
    name: ${DB_VOLUME_NAME:-local_postgres_data}
  media_volume:
    external: false
    name: ${MEDIA_VOLUME_NAME:-local_media_volume}
