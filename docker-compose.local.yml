services:
  backend:
    ports:
      # Fail loud instead of falling back. The former default was `:-8000`,
      # which silently bound hram's port whenever WEB_PORT was unset — and the
      # db/redis defaults below were the Postgres/Redis system ports, the two
      # most likely to be occupied on any dev machine. A missing variable must
      # stop the stack, not invent a number.
      - "${WEB_PORT:?WEB_PORT is not set - run generate-env, and fill environments.local in project.yaml}:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/media:/app/backend/media
      # Local hot-reload: serve the SPA live from the host frontend build tree.
      # run-dev --watch rebuilds into frontend/build_current; Django reads it via
      # FRONTEND_BUILD_DIR below (STATIC_ROOT + TEMPLATES.DIRS). Mirrors hram/spesix.
      - ./frontend:/app/frontend_host
    environment:
      - ENV_TYPE=local
      - FRONTEND_BUILD_DIR=/app/frontend_host/build_current
    env_file:
      - .env

  db:
    ports:
      - "${DB_HOST_PORT:?DB_HOST_PORT is not set - run generate-env, and fill environments.local in project.yaml}:5432"

  redis:
    image: redis:8-alpine
    command: redis-server --loglevel warning
    ports:
      - "${REDIS_HOST_PORT:?REDIS_HOST_PORT is not set - run generate-env, and fill environments.local in project.yaml}:6379"

networks:
  proxy:
    external: false
    name: app_local_proxy
