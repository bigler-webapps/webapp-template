# Secrets schema — REPLACE PLACEHOLDERS after "Use this template"
#
# The Proton paths below are an example layout. After forking:
#   - either replace "Projekt Template" with your own Proton vault path
#   - or remove `source:` fields and use the yaml-values flow
#     (see https://github.com/bigler-webapps/webapp-management-template/blob/main/docs/SECRETS.md)

config:
  target_repo: "<your-org>/<your-repo>"

secrets:
  DEBUG:
    source: "proton://Projekt Template/Django/debug"
    dev_default: "True"

  DJANGO_SECRET_KEY:
    source: "proton://Projekt Template/Django/secret_key"
    dev_default: "local-dev-secret-key"

  DB_USER:
    source: "proton://Projekt Template/Database/username"
    dev_default: "template"

  DB_PASSWORD:
    source: "proton://Projekt Template/Database/password"
    dev_default: "template"

  DB_NAME:
    source: "proton://Projekt Template/Database/database_name"
    dev_default: "db_template"

  DB_HOST:
    source: "proton://Projekt Template/Database/host"
    dev_default: "db"

  DB_PORT:
    dev_default: "5432"

  EMAIL_HOST:
    source: "proton://Projekt Template/Mail/host"
    dev_default: ""

  EMAIL_PORT:
    source: "proton://Projekt Template/Mail/port"
    dev_default: "1025"

  EMAIL_USER:
    source: "proton://Projekt Template/Mail/user"
    dev_default: ""

  EMAIL_PASSWORD:
    source: "proton://Projekt Template/Mail/password"
    dev_default: ""

  GOOGLE_CLIENT_ID:
    source: "proton://Projekt Template/SocialAuth/google_id"
    dev_default: ""

  GOOGLE_SECRET:
    source: "proton://Projekt Template/SocialAuth/google_secret"
    dev_default: ""

  MICROSOFT_CLIENT_ID:
    source: "proton://Projekt Template/SocialAuth/microsoft_id"
    dev_default: ""

  MICROSOFT_SECRET:
    source: "proton://Projekt Template/SocialAuth/microsoft_secret"
    dev_default: ""

  MICROSOFT_TENANT_ID:
    source: "proton://Projekt Template/SocialAuth/microsoft_tenant"
    dev_default: ""

  VITE_APP_MUI_LICENSE_KEY:
    source: "proton://Projekt Template/API-Keys/mui_license"
    dev_default: null

  SSH_HOST:
    source: "proton://Projekt Template/Infrastructure-Access/ssh_host"
    dev_default: "ignore_local"

  SSH_USER:
    source: "proton://Projekt Template/Infrastructure-Access/ssh_user"
    dev_default: "ignore_local"

  SSH_PRIVATE_KEY:
    source: "proton://Projekt Template/Infrastructure-Access/ssh_private_key"
    dev_default: "ignore_local"
