# Secrets schema — REPLACE PLACEHOLDERS after "Use this template"
#
# Proton path format:  proton://<vault-name>/<item-name>/<field-name>
#
# Two-vault architecture:
#   proton://<tenant-slug>/...        ← per-app vault (create in Proton for this tenant)
#   proton://webapp-management/...    ← platform vault (already exists; shared secrets live here)
#
# See: webapp-management-template/docs/ONBOARDING.md §A.0 for vault setup walkthrough.
# See: webapp-management-template/docs/SECRETS.md for full schema reference.

config:
  target_repo: "<your-org>/<your-repo>"
  use_project_yaml: true

secrets:
  # --- Per-app secrets (vault: <tenant-slug>) ---
  DJANGO_SECRET_KEY:
    source: "proton://<tenant-slug>/django/secret_key"
    dev_default: "local-dev-secret-key"

  DB_PASSWORD:
    source: "proton://<tenant-slug>/database/password"
    dev_default: "db-password"

  RESEND_API_KEY:
    source: "proton://webapp-management/mail/resend_api_key"
    dev_default: ""

  # Web Push (VAPID) — only needed if the app uses push notifications.
  # Create the key pair once per app: npx web-push generate-vapid-keys
  # Store in Proton under <tenant-slug>/api-keys/vapid_private_key + vapid_public_key.
  # Remove these two entries if the app does not use push notifications.
  VAPID_PRIVATE_KEY:
    source: "proton://<tenant-slug>/api-keys/vapid_private_key"
    dev_default: ""

  VAPID_PUBLIC_KEY:
    source: "proton://<tenant-slug>/api-keys/vapid_public_key"
    dev_default: ""

  # Social Auth — secrets only; client_id/tenant_id are non-secret (project.yaml app_env)
  # Source points to the SHARED webapp-management vault — do NOT create a per-app vault item.
  GOOGLE_SECRET:
    source: "proton://webapp-management/social-login/google_client_secret"
    dev_default: ""

  MICROSOFT_SECRET:
    source: "proton://webapp-management/social-login/azure_client_secret"
    dev_default: ""

  # --- Shared CI credentials (platform vault: webapp-management) ---
  # Same OAuth client used across ALL apps — do not create new clients per app.
  TS_OAUTH_CLIENT_ID:
    source: "proton://webapp-management/ci-tokens/ts_oauth_client_id"
    exclude_from_env: true
    dev_default: ""

  TS_OAUTH_SECRET:
    source: "proton://webapp-management/ci-tokens/ts_oauth_secret"
    exclude_from_env: true
    dev_default: ""

  # --- Shared monitoring credentials (platform vault: webapp-management) ---
  # Same Kuma automation user across all apps.
  KUMA_AUTOMATION_USER:
    source: "proton://webapp-management/monitoring/kuma_automation_user"
    exclude_from_env: true
    dev_default: ""

  KUMA_AUTOMATION_PASSWORD:
    source: "proton://webapp-management/monitoring/kuma_automation_password"
    exclude_from_env: true
    dev_default: ""

  # --- Shared API licenses (platform vault: webapp-management) ---
  VITE_APP_MUI_LICENSE_KEY:
    source: "proton://webapp-management/shared-api-keys/mui_license"
    dev_default: null

  
