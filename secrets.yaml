# Secrets schema — REPLACE PLACEHOLDERS after "Use this template"
#
# The Proton paths below are an example layout. After forking:
#   - either replace "Projekt Template" with your own Proton vault path
#   - or remove `source:` fields and use the yaml-values flow
#     (see https://github.com/bigler-webapps/webapp-management-template/blob/main/docs/SECRETS.md)

config:
  target_repo: "<your-org>/<your-repo>"
  use_project_yaml: true

secrets:
  DEBUG:
    source: "proton://Projekt Template/Django/debug"
    dev_default: "True"

  DJANGO_SECRET_KEY:
    source: "proton://Projekt Template/Django/secret_key"
    dev_default: "local-dev-secret-key"

  DB_USER:
    source: "proton://Projekt Template/Database/username"
    dev_default: "template"

  DB_PASSWORD:
    source: "proton://Projekt Template/Database/password"
    dev_default: "template"

  DB_NAME:
    source: "proton://Projekt Template/Database/database_name"
    dev_default: "db_template"

  DB_HOST:
    source: "proton://Projekt Template/Database/host"
    dev_default: "db"

  DB_PORT:
    dev_default: "5432"

  EMAIL_HOST:
    source: "proton://Projekt Template/Mail/host"
    dev_default: ""

  EMAIL_PORT:
    source: "proton://Projekt Template/Mail/port"
    dev_default: "1025"

  EMAIL_USER:
    source: "proton://Projekt Template/Mail/user"
    dev_default: ""

  EMAIL_PASSWORD:
    source: "proton://Projekt Template/Mail/password"
    dev_default: ""

  GOOGLE_CLIENT_ID:
    source: "proton://Projekt Template/SocialAuth/google_id"
    dev_default: ""

  GOOGLE_SECRET:
    source: "proton://Projekt Template/SocialAuth/google_secret"
    dev_default: ""

  MICROSOFT_CLIENT_ID:
    source: "proton://Projekt Template/SocialAuth/microsoft_id"
    dev_default: ""

  MICROSOFT_SECRET:
    source: "proton://Projekt Template/SocialAuth/microsoft_secret"
    dev_default: ""

  MICROSOFT_TENANT_ID:
    source: "proton://Projekt Template/SocialAuth/microsoft_tenant"
    dev_default: ""

  VITE_APP_MUI_LICENSE_KEY:
    source: "proton://Projekt Template/API-Keys/mui_license"
    dev_default: null

  SSH_HOST:
    source_template: "proton://Projekt Webapp-Management/Infrastructure-Access {server}/ssh_host"
    dev_default: "ignore_local"

  SSH_USER:
    source_template: "proton://Projekt Webapp-Management/Infrastructure-Access {server}/ssh_user"
    dev_default: "ignore_local"

  SSH_PRIVATE_KEY:
    source_template: "proton://Projekt Webapp-Management/Infrastructure-Access {server}/ssh_private_key"
    dev_default: "ignore_local"

  # --- Tailscale OAuth for CI (deploy via Tailscale-SSH) ---
  # Used by workflow-templates `deploy-app@v2.x` and `register-kuma-monitors@v2.x`
  # composite actions. CI joins the Tailnet as ephemeral node tagged `tag:ci-deploy`,
  # then reaches the target server via Tailscale-SSH. Replaces the old
  # SSH_PRIVATE_KEY-based deploy path (removed in workflow-templates v1.11.0).
  # All apps in the tenant share the SAME tenant-scoped OAuth client.
  TS_OAUTH_CLIENT_ID:
    source: "proton://Projekt Webapp-Management/Cloudflare API/ts_oauth_client_id"
    exclude_from_env: true
    dev_default: ""

  TS_OAUTH_SECRET:
    source: "proton://Projekt Webapp-Management/Cloudflare API/ts_oauth_secret"
    exclude_from_env: true
    dev_default: ""

  # --- Uptime Kuma Automation (optional) ---
  # Only needed if you enable the register-kuma-monitors step in main.yml.
  # All apps in the same tenant share the SAME automation user and the
  # SAME central Kuma host (typically tenant 0 / main-prod). Point each
  # `source:` at the tenant's single shared Proton entry — same value
  # across all your app repos.
  KUMA_AUTOMATION_USER:
    source: "proton://Projekt Webapp-Management/Traefik/kuma_automation_user"
    exclude_from_env: true
    dev_default: ""

  KUMA_AUTOMATION_PASSWORD:
    source: "proton://Projekt Webapp-Management/Traefik/kuma_automation_password"
    exclude_from_env: true
    dev_default: ""

  # SSH tunnel to the CENTRAL Kuma host. Distinct from this app's own
  # SSH_HOST because the app may deploy to a different server than where
  # Kuma lives. All apps in the tenant point to the same Kuma host.
  KUMA_SSH_HOST:
    source: "proton://Projekt Webapp-Management/Kuma-Access/ssh_host"
    exclude_from_env: true
    dev_default: ""

  KUMA_SSH_USER:
    source: "proton://Projekt Webapp-Management/Kuma-Access/ssh_user"
    exclude_from_env: true
    dev_default: ""

  KUMA_SSH_PRIVATE_KEY:
    source: "proton://Projekt Webapp-Management/Kuma-Access/ssh_private_key"
    exclude_from_env: true
    dev_default: ""
