services:
  template_app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    
    # Dynamischer Name
    container_name: ${CONTAINER_NAME_PREFIX}_backend
    
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - REDIS_HOST=redis
    
    volumes:
      # Standardisiertes Named Volume
      - media_volume:/app/backend/media
    
    networks:
      - app-network
      - proxy

    # Traefik Configuration
    labels:
      - "traefik.enable=true"
      # Vereinfachte Regel aus .env
      - "traefik.http.routers.${ROUTER_NAME}.rule=${TRAEFIK_ROUTER_RULE}"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_NAME}.tls.certresolver=myresolver"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=8000"

    restart: unless-stopped

  db:
    image: postgis/postgis:14-3.1
    container_name: ${CONTAINER_NAME_PREFIX}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: ${CONTAINER_NAME_PREFIX}_redis
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
  proxy:
    external: true
    name: traefik_proxy

volumes:
  # Externe Volumes für Persistenz (Namen müssen auf Server existieren oder hier neu angelegt werden)
  postgres_data:
    external: true
    name: project_template_postgres_data
  
  media_volume:
    external: true
    name: project_template_media_volume