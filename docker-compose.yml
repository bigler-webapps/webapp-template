services:
  backend:
    image: ${IMAGE_NAME:-ghcr.io/ihr-user/project-template-backend}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - UV_FLAGS=${UV_FLAGS:-}
        - VITE_APP_MUI_LICENSE_KEY=${VITE_APP_MUI_LICENSE_KEY}
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - REDIS_HOST=redis
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - media_volume:/app/backend/media
    networks:
      - app-network
      - proxy
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-false}"
      - "traefik.http.routers.${ROUTER_NAME}.rule=${TRAEFIK_ROUTER_RULE}"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_NAME}.tls.certresolver=myresolver"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=8000"
    restart: unless-stopped

  db:
    image: postgis/postgis:14-3.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    labels:
      - "backup.enable=${BACKUP_ENABLE:-false}"
      - "backup.pg.user=${DB_USER}"
      - "backup.pg.db=${DB_NAME}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  proxy:
    name: traefik_proxy
    external: ${USE_EXTERNAL_PROXY:-false}

volumes:
  postgres_data:
    {}

  media_volume:
    {}
