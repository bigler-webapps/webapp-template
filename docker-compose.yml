services:
  project_template_app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${CONTAINER_NAME_PREFIX}_backend
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - REDIS_HOST=redis
    volumes:
      - media_volume:/app/backend/media
    networks:
      - app-network
      - proxy
    
    # Traefik Configuration
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_NAME}.rule=${TRAEFIK_ROUTER_RULE}"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_NAME}.tls.certresolver=myresolver"
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=8000"

    restart: unless-stopped

  db:
    image: postgis/postgis:14-3.1
    container_name: ${CONTAINER_NAME_PREFIX}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: ${CONTAINER_NAME_PREFIX}_redis
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
  proxy:
    external: true
    name: traefik_proxy

volumes:
  # WICHTIG: Namen sind jetzt dynamisch basierend auf dem Prefix.
  # Verhindert Konflikte, wenn mehrere Template-Instanzen auf demselben Server laufen.
  postgres_data:
    name: ${CONTAINER_NAME_PREFIX}_postgres_data
  
  media_volume:
    name: ${CONTAINER_NAME_PREFIX}_media_volume