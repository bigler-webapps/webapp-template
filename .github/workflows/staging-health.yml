name: Staging Health

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-health:
    # Skip on the template repo itself — no staging environment exists.
    if: ${{ ! github.event.repository.is_template }}
    uses: bigler-webapps/workflow-templates/.github/workflows/staging-health.yml@main
    with:
      runs-on: netcup
