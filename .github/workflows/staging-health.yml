name: Staging Health

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-health:
    # Skip on the template repo itself — no staging environment exists.
    if: ${{ ! github.event.repository.is_template }}
    uses: bigler-webapps/workflow-templates/.github/workflows/staging-health.yml@main
    secrets: inherit
    with:
      runs-on: netcup
      # Auth smoke without a login (WFT-CI-31): opens the login page and checks
      # that a malformed e-mail yields a translated sentence, not a raw code.
      auth-smoke: true
      login-path: '/login'
