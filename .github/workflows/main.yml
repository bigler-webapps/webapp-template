name: Deploy project_template_app

on:
  push:
    tags:
      - 'deploy-project_template_app-*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # SCHRITT 1: Konfiguration & .env generieren
      # ---------------------------------------------------------
      - name: Generate Configuration and .env
        run: |
          # 1. KONFIGURATION AUS SECRETS LADEN
          APP_DOMAINS="${{ secrets.APP_DOMAINS }}" 
          APP_NAME="${{ secrets.ROUTER_NAME }}"
          CTR_PREFIX="${{ secrets.CONTAINER_NAME_PREFIX }}"
          
          # Validierung
          if [ -z "$APP_DOMAINS" ]; then echo "❌ ERROR: Secret APP_DOMAINS is empty"; exit 1; fi
          if [ -z "$APP_NAME" ]; then echo "❌ ERROR: Secret ROUTER_NAME is empty"; exit 1; fi
          if [ -z "$CTR_PREFIX" ]; then echo "❌ ERROR: Secret CONTAINER_NAME_PREFIX is empty"; exit 1; fi

          # 2. AUTO-CALC (Traefik Rules & Hosts)
          DJANGO_HOSTS_CSV=$(echo "$APP_DOMAINS" | tr ' ' ',')
          
          CSRF_URLS=""
          for d in $APP_DOMAINS; do
            if [ -z "$CSRF_URLS" ]; then CSRF_URLS="https://$d"; else CSRF_URLS="$CSRF_URLS,https://$d"; fi
          done
          
          TRAEFIK_RULE=""
          for d in $APP_DOMAINS; do
            PART="Host(\`$d\`)"
            if [ -z "$TRAEFIK_RULE" ]; then TRAEFIK_RULE="$PART"; else TRAEFIK_RULE="$TRAEFIK_RULE || $PART"; fi
          done
          
          MAIN_DOMAIN=$(echo "$APP_DOMAINS" | awk '{print $1}')

          # 3. .ENV SCHREIBEN
          cat <<EOF > .env
          # --- DB ---
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}

          # --- Django / App ---
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          ENV_TYPE=production
          DEBUG=False
          
          # --- Traefik & Docker Config (Aus Secrets!) ---
          CONTAINER_NAME_PREFIX=${CTR_PREFIX}
          ROUTER_NAME=${APP_NAME}
          
          # Generierte Werte
          DOMAIN_URL=${MAIN_DOMAIN}
          DJANGO_ALLOWED_HOSTS=${DJANGO_HOSTS_CSV},localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=${CSRF_URLS}
          TRAEFIK_ROUTER_RULE=${TRAEFIK_RULE}
          PUBLIC_ORIGIN=https://${MAIN_DOMAIN}

          # --- Mail ---
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.EMAIL_USER }}

          # Optional
          ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
          
          IMAGE_TAG=latest
          EOF

      # ---------------------------------------------------------
      # SCHRITT 2: Rsync
      # ---------------------------------------------------------
      - name: Rsync project to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_PRIVATE_KEY }}
          switches: -avzr --delete --exclude 'certbot/letsencrypt' --exclude 'docker-compose.override.yml' --exclude '.git' --exclude 'frontend/node_modules'
          path: "./"
          remote_path: "/srv/apps/project_template"

      # ---------------------------------------------------------
      # SCHRITT 3: Docker Start & Migrate
      # ---------------------------------------------------------
      - name: Build & restart containers
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            TARGET_DIR="/srv/apps/project_template"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            
            # Debug: .env prüfen
            if [ ! -f .env ]; then echo "❌ .env fehlt!"; exit 1; fi
            
            # Bauen & Starten
            # Wir nutzen explizit --env-file, um sicherzugehen, dass die Variablen geladen werden
            docker compose --env-file .env up -d --build --remove-orphans

            echo "⏳ Warte 10 Sekunden auf Datenbank-Start..."
            sleep 60

            # DB-Migrationen
            # KORREKTUR: Service Name ist 'template_app' (nicht project_template_app)
            echo "🚀 Starte Migration..."
            docker compose exec -T template_app python manage.py migrate --noinput