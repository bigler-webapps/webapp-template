name: Deploy App

on:
  # Auto: push to develop → staging, push to main → production
  push:
    branches: ['develop', 'main']

  # Manual
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  call-deploy:
    uses: MichaBigler/webapp-management/.github/workflows/deploy-app.yml@main
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    secrets: inherit
