name: Deploy project_template_app

on:
  push:
    tags:
      - 'deploy-project_template_app-*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # SCHRITT 0: Define Environment & Paths
      # ---------------------------------------------------------
      - name: Determine Target Environment
        id: env-selector
        run: |
          # 1. Determine Environment (Manual Input vs Tag)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          else
            TARGET_ENV="production"
          fi
          
          echo "Selected Environment: $TARGET_ENV"
          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV

          # 2. Determine Server Path based on Environment
          if [ "$TARGET_ENV" == "staging" ]; then
            echo "REMOTE_PATH=/srv/apps/project_template_stage" >> $GITHUB_ENV
          else
            echo "REMOTE_PATH=/srv/apps/project_template" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------
      # SCHRITT 1: Generate .env via Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Generate .env
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python scripts/generate_env.py --env ${{ env.TARGET_ENV }}

      # ---------------------------------------------------------
      # SCHRITT 2: Rsync
      # ---------------------------------------------------------
      - name: Rsync project to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_PRIVATE_KEY }}
          # Excludes remain the same
          switches: -avzr --delete --exclude 'certbot/letsencrypt' --exclude 'docker-compose.override.yml' --exclude '.git' --exclude 'frontend/node_modules' --exclude '__pycache__'
          path: "./"
          # Uses the dynamic path defined in Step 0
          remote_path: ${{ env.REMOTE_PATH }}

      # ---------------------------------------------------------
      # SCHRITT 3: Docker Start
      # ---------------------------------------------------------
      - name: Build & restart containers
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            # Use dynamic path
            cd ${{ env.REMOTE_PATH }}
            
            # Ensure .env exists
            if [ ! -f .env ]; then echo "❌ .env missing"; exit 1; fi
            
            # Build and Start
            docker compose --env-file .env up -d --build --remove-orphans
            
            echo "⏳ Waiting for DB..."
            sleep 5
            
            # Dynamic Container Selection for Migration
            # We read the prefix from the generated .env file to know the container name
            # Format in .env is CONTAINER_NAME_PREFIX=template_stage (for example)
            
            PREFIX=$(grep "^CONTAINER_NAME_PREFIX=" .env | cut -d '=' -f2)
            CTR_NAME="${PREFIX}_app"
            
            echo "🚀 Starting migration on container: $CTR_NAME"
            docker compose exec -T "$CTR_NAME" python manage.py migrate --noinput