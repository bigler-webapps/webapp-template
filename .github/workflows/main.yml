name: Deploy App

on:
  # 1. Automatischer Trigger bei Tags
  push:
    tags: ['deploy-*']

  # 2. Manuelles Menü
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  call-deploy:
    # Verweis auf den zentralen Workflow (Version beachten!)
    uses: MichaBigler/webapp-management/.github/workflows/deploy-app.yml@main
    
    # Hier übergeben wir die Auswahl an den zentralen Workflow
    with:
      # Logik: Wenn manuell (inputs vorhanden), nimm das. 
      # Sonst (bei Tag-Push), nimm 'production'.
      environment: ${{ inputs.environment || 'production' }}
    
    # Übergibt alle Secrets (SSH, DB, etc.) automatisch
    secrets: inherit