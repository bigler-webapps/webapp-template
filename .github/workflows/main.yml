name: Deploy App

on:
  # Auto: push to develop → staging, push to main → production
  push:
    branches: ['develop', 'main']

  # Manual
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Skip deploy when this workflow runs on the template repo itself.
    # The template has no real deploy target / no app behind it; the job
    # would only fail and spam notifications. New repos created via
    # "Use this template" have is_template=false → deploy runs normally.
    if: ${{ ! github.event.repository.is_template }}
    # PLACEHOLDER: replace with [self-hosted, <runner-label>] when using a self-hosted runner pool.
    # GitHub-hosted (ubuntu-latest) works but costs more minutes and has no warm Docker cache.
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # workflow_dispatch: staging → develop, production → main.
          # Push events: '' lets checkout use the triggering ref (develop or main).
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.environment == 'staging' && 'develop' || 'main') || '' }}

      - name: Resolve checked-out SHA
        id: resolve_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: bigler-webapps/workflow-templates/.github/actions/publish-backend-image@v2.9.0
        with:
          image_tag: ${{ steps.resolve_sha.outputs.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vite_app_mui_license_key: ${{ secrets.VITE_APP_MUI_LICENSE_KEY }}

      - uses: bigler-webapps/workflow-templates/.github/actions/deploy-app@v2.9.0
        with:
          image_tag: ${{ steps.resolve_sha.outputs.sha }}
          environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          # ssh_host: composite-derived from project.yaml/environments[env].server
          # ssh_user: composite default 'deploy'
          # ssh_private_key: removed in v1.11.0 (Tailscale-SSH-only)
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
          secrets_context_json: ${{ toJson(secrets) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
