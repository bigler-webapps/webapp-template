name: Deploy project_template_app

on:
  push:
    tags:
      - 'deploy-project_template_app-*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # SCHRITT 1: Konfiguration & .env generieren (Zentralisiert)
      # ---------------------------------------------------------
      - name: Generate Configuration and .env
        run: |
          # =======================================================
          # 1. ZENTRALE KONFIGURATION (Hier Domains anpassen!)
          # =======================================================
          # Einfach alle Domains durch Leerzeichen getrennt auflisten.
          # Die erste Domain wird oft als Hauptdomain betrachtet.
          APP_DOMAINS="bigler-consult.ch www.bigler-consult.ch"
          
          # Name des Routers/Containers (muss unique sein auf dem Server)
          APP_NAME="bigler-consult-prod"
          CTR_PREFIX="bigler_consult_prod"
          
          # =======================================================
          # 2. AUTOMATISCHE BERECHNUNG (Nicht anfassen)
          # =======================================================
          
          # A) Django ALLOWED_HOSTS (Komma-getrennt)
          # Wandelt "a b c" in "a,b,c" um
          DJANGO_HOSTS_CSV=$(echo "$APP_DOMAINS" | tr ' ' ',')
          
          # B) CSRF/CORS URLs (Mit https:// Prefix)
          # Wandelt "a b" in "https://a,https://b" um
          CSRF_URLS=""
          for d in $APP_DOMAINS; do
            if [ -z "$CSRF_URLS" ]; then CSRF_URLS="https://$d"; else CSRF_URLS="$CSRF_URLS,https://$d"; fi
          done
          
          # C) Traefik Router Rule
          # Baut den String: Host(`a`) || Host(`b`) ...
          # Wir nutzen Backticks (\`) für Traefik, die wir in Bash escapen müssen.
          TRAEFIK_RULE=""
          for d in $APP_DOMAINS; do
            PART="Host(\`$d\`)"
            if [ -z "$TRAEFIK_RULE" ]; then TRAEFIK_RULE="$PART"; else TRAEFIK_RULE="$TRAEFIK_RULE || $PART"; fi
          done
          
          # Erste Domain als Hauptdomain für Zertifikat (optional)
          MAIN_DOMAIN=$(echo "$APP_DOMAINS" | awk '{print $1}')

          echo "---------------------------------------------"
          echo "Config Generated:"
          echo "Domains: $APP_DOMAINS"
          echo "Traefik Rule: $TRAEFIK_RULE"
          echo "---------------------------------------------"

          # =======================================================
          # 3. .ENV DATEI SCHREIBEN
          # =======================================================
          cat <<EOF > .env
          # --- Secrets ---
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_HOST=db
          DB_PORT=5432
          
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          
          # --- Mail ---
          EMAIL_HOST=${{ secrets.MAIL_HOST }}
          EMAIL_PORT=${{ secrets.MAIL_PORT }}
          EMAIL_USE_TLS=${{ secrets.MAIL_USE_TLS }}
          EMAIL_USER=${{ secrets.MAIL_USERNAME }}
          EMAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          
          
          # --- Infrastructure Auto-Config ---
          ENV_TYPE=production
          DEBUG=False
          ALLOWED_HOSTS=queue.kerzenziehen.ch,localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=https://queue.kerzenziehen.ch
          PUBLIC_ORIGIN=https://queue.kerzenziehen.ch

          # optional (falls verwendet):
          ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}

          # --- Mail (Gmail SMTP via App Password) ---
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.EMAIL_USER }}
          EOF

      - name: Rsync project to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_PRIVATE_KEY }}
          switches: -avzr --delete --exclude 'certbot/letsencrypt' --exclude 'docker-compose.override.yml' --exclude '.git' --exclude 'frontend/node_modules'
          path: "./"
          # Standardisierter Pfad
          remote_path: "/srv/apps/project_template"

      # ---------------------------------------------------------
      # SCHRITT 3: Docker Start
      # ---------------------------------------------------------
      - name: Build & restart containers
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            mkdir -p /srv/apps/project_template
            cd /srv/apps/project_template
            
            docker compose up -d --build --remove-orphans

            # Migrationen
            # Service Name aus docker-compose prüfen! (Ich nehme template_app an)
            docker compose exec -T template_app python manage.py migrate --noinput