name: Deploy App

on:
  # Auto: push to develop → staging, push to main → production
  push:
    branches: ['develop', 'main']

  # Manual
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: bigler-webapps/workflow-templates/.github/actions/deploy-app@v1
        with:
          environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          secrets_context_json: ${{ toJson(secrets) }}

      # Optional: register Uptime Kuma monitors after every successful deploy.
      # Remove this step (and monitoring/monitor.yml) if you don't use Kuma.
      # See monitoring/monitor.yml for setup notes.
      - uses: bigler-webapps/workflow-templates/.github/actions/register-kuma-monitors@v1
        if: success()
        with:
          config_path: monitoring/monitor.yml
          # Tunnel to the central Kuma host (not this app's deploy host).
          ssh_host: ${{ secrets.KUMA_SSH_HOST }}
          ssh_user: ${{ secrets.KUMA_SSH_USER }}
          ssh_private_key: ${{ secrets.KUMA_SSH_PRIVATE_KEY }}
          kuma_user: ${{ secrets.KUMA_AUTOMATION_USER }}
          kuma_password: ${{ secrets.KUMA_AUTOMATION_PASSWORD }}
