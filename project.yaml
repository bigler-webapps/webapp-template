project_name: "project_template"
container_prefix: "template"
image_name: "ghcr.io/ihr-user/project-template-backend"

environments:
  production:
    domains:
      - "template.bigler-consult.ch"
    use_traefik: true

  staging:
    domains:
      - "template.sys.bigler-consult.ch"
    use_traefik: true

  local:
    domains:
      - "localhost"
      - "127.0.0.1"
    use_traefik: false
    web_port: 8027
    frontend_port: 5127
    db_port: 5427
    redis_port: 6327
