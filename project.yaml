# Project config — REPLACE PLACEHOLDERS after "Use this template"
#
# Required:
#   - project_name: short slug, used in container/volume names
#   - container_prefix: prefix for container names (e.g. "myapp" → myapp_backend_1)
#   - image_name: full image path for ghcr.io or other registry

project_name: "<your-app-slug>"             # e.g. "kerzenziehen", "jg-ferien"
container_prefix: "<your-prefix>"           # e.g. "kz", "jg"
image_name: "ghcr.io/bigler-webapps/<your-app>-backend"  # REQUIRED: replace <your-app> before first deploy; literal placeholder causes generate-env to fail-loud

# Non-secret runtime config — goes here, NOT in secrets.yaml / Proton.
# dcm generate-env (>=2.17.0) reads these and injects them as env vars.
# Secrets (passwords, OAuth secrets, API keys) stay in Proton / secrets.yaml.
app_env:
  DB_NAME: <your-app-slug>_db
  DB_USER: <your-app-slug>
  DB_HOST: db
  EMAIL_PROVIDER: resend
  DEFAULT_FROM_EMAIL: "noreply@example.com"   # REPLACE: e.g. "<your-app>@<your-domain>"
  # Social Login — shared webapp-auth client (same IDs for all apps; not secret)
  # After adding these, register redirect URIs: see docs/ONBOARDING.md Phase 3 → Social Login.
  GOOGLE_CLIENT_ID: "585298874656-8r2osbe2mpuah9odf8g15l0nsikvmq1a.apps.googleusercontent.com"
  MICROSOFT_CLIENT_ID: "f107a674-af2d-457f-b50f-3fb0d820c553"
  MICROSOFT_TENANT_ID: common

environments:
  production:
    server: main-prod
    domains:
      - "<your-domain.example.com>"
    use_traefik: true

  staging:
    server: staging
    domains:
      - "<your-staging-domain.example.com>"
    use_traefik: true

  local:
    domains:
      - "localhost"
      - "127.0.0.1"
    use_traefik: false
    # REPLACE all four before the first local run. Claim an unused NN from the
    # port register (webapp-management/docs/LOCAL_PORTS.md) and enter your app
    # there in the same step; the families are web 80NN / frontend 51NN /
    # db 54NN / redis 63NN with the SAME NN.
    #
    # These are deliberately non-numeric placeholders, like image_name above:
    # a real default would be a real app's port, and every repo created from
    # this template that forgot to renumber would silently collide with it.
    # That is exactly how hpc-bridge ended up on cockpit's ports. Failing loudly
    # here is cheaper than debugging a "port is already allocated" that names a
    # container you have never heard of.
    web_port: "<REPLACE-web-80NN>"
    frontend_port: "<REPLACE-frontend-51NN>"
    db_port: "<REPLACE-db-54NN>"
    redis_port: "<REPLACE-redis-63NN>"
